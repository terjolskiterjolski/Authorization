<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | Nexora</title>
    <link rel="stylesheet" href="styles.css?v=5">
</head>
<body class="auth-page">
    <header class="site-header">
        <a class="brand" href="login.html"><span class="brand-mark">N</span><span>Nexora</span></a>
        <div class="trust-badge"><span aria-hidden="true">&#9671;</span> Secure &amp; trusted platform</div>
    </header>
    <div class="wave wave-one"></div><div class="wave wave-two"></div>
    <main class="auth-shell">
        <section class="auth-card verification-card">
            <div class="auth-content">
                <div class="verification-icon" aria-hidden="true">&#128274;</div>
                <div class="form-heading">
                    <h1>Create a new password</h1>
                    <p>Use at least 8 characters.</p>
                </div>
                <form id="resetPasswordForm">
                    <label>New password
                        <span class="field"><span class="icon">&#9635;</span><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></span>
                    </label>
                    <label>Confirm password
                        <span class="field"><span class="icon">&#9635;</span><input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password" required></span>
                    </label>
                    <p id="resetPasswordMessage" class="form-message" aria-live="polite"></p>
                    <button class="primary-button" type="submit">Reset password</button>
                </form>
            </div>
        </section>
    </main>
    <script src="reset-password.js?v=1"></script>
</body>
</html>
