<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Nexora</title><link rel="stylesheet" href="styles.css?v=2"></head>
<body class="auth-page">
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>Nexora</span></a><div class="trust-badge"><span>♢</span> Secure &amp; trusted platform</div></header>
<div class="wave wave-one"></div><div class="wave wave-two"></div>
<main class="auth-shell"><section class="auth-card login-card">
<nav class="auth-tabs"><a class="active" href="login.html">Sign In</a><a href="index.html">Register</a></nav>
<div class="auth-content"><div class="form-heading"><h1>Welcome back</h1><p>Sign in to access your account and continue</p></div>
<form id="loginForm">
<label>Email<span class="field"><span class="icon">✉</span><input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email" required></span></label>
<label>Password<span class="field"><span class="icon">▣</span><input id="loginPassword" type="password" placeholder="Your password" autocomplete="current-password" required><button class="eye-toggle" type="button" data-target="loginPassword" aria-label="Show password">◉</button></span></label>
<div class="form-options"><label class="check-line"><input id="rememberMe" type="checkbox"><span>Remember me</span></label><a class="forgot-password-link" href="/verify-code.html" onclick="window.location.assign('/verify-code.html'); return false;">Forgot password?</a></div>
<p id="loginMessage" class="form-message" aria-live="polite"></p><button class="primary-button" type="submit">Continue</button>
</form><div class="divider"><span>or</span></div>
<div class="social-buttons"><button type="button"><b class="google">G</b><span>Continue<br>with Google</span></button><button type="button"><b class="github">GH</b><span>Continue<br>with GitHub</span></button><button type="button"><b class="microsoft">▦</b><span>Continue<br>with Microsoft</span></button></div>
<p class="auth-switch">New here? <a href="index.html">Create an account</a></p></div>
</section></main><script src="app.js?v=5"></script></body></html>
