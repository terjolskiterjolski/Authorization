<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify code | Nexora</title>
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="auth-page">
    <header class="site-header">
        <a class="brand" href="login.html"><span class="brand-mark">N</span><span>Nexora</span></a>
        <div class="trust-badge"><span aria-hidden="true">&#9671;</span> Secure &amp; trusted platform</div>
    </header>

    <div class="wave wave-one"></div>
    <div class="wave wave-two"></div>

    <main class="auth-shell">
        <section class="auth-card verification-card">
            <div class="auth-content">
                <a class="back-link" href="login.html" aria-label="Return to sign in">&larr; Back to sign in</a>
                <div class="verification-icon" aria-hidden="true">&#9993;</div>
                <div class="form-heading">
                    <h1>Verify your email</h1>
                    <p id="verificationDescription">Enter your email address and we’ll send you a six-digit code.</p>
                </div>

                <form id="verificationForm" novalidate>
                    <label class="verification-email-label" for="verificationEmail">Email address</label>
                    <div class="verification-email-row">
                        <div class="field">
                            <span class="icon" aria-hidden="true">&#9993;</span>
                            <input id="verificationEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus>
                        </div>
                        <button id="sendCodeButton" class="secondary-button" type="button">Send code</button>
                    </div>

                    <div id="codeSection" class="code-section" hidden>
                        <div class="code-section-heading">
                            <span>Verification code</span>
                            <button id="changeEmailButton" type="button">Change email</button>
                        </div>
                    <div class="code-inputs" role="group" aria-label="Six-digit verification code">
                        <input class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1" required>
                        <input class="code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" required>
                        <input class="code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" required>
                        <input class="code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" required>
                        <input class="code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" required>
                        <input class="code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" required>
                    </div>
                    </div>
                    <p id="verificationMessage" class="form-message" aria-live="polite"></p>
                    <button id="verifyCodeButton" class="primary-button" type="submit" hidden>Verify code</button>
                </form>
            </div>
        </section>
    </main>

    <script src="verify-code.js?v=4"></script>
</body>
</html>
